<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>CAMTYPE ADMIN</title><meta name="robots" content="noindex,nofollow,noarchive">
<style>
:root{--ink:#111;--muted:#777;--line:#e8e8e8;--soft:#f6f6f6}*{box-sizing:border-box}html,body{margin:0;background:#fff;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit}.gate{min-height:100dvh;max-width:430px;margin:auto;padding:24px 18px;display:flex;flex-direction:column}.gate-brand,.brand{font-size:13px;font-weight:800;letter-spacing:.12em}.gate-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:52px}.gate h1{font-size:34px;letter-spacing:-.05em;margin:0 0 10px}.gate p,.sub{font-size:13px;color:#777}.pin{height:54px;border:1px solid #d8d8d8;padding:0 14px;font-size:22px;letter-spacing:.22em;text-align:center;outline:none}.pin:focus,input:focus,textarea:focus,select:focus{border-color:#111;outline:none}.unlock,.black{height:44px;border:0;background:#111;color:#fff;font-weight:700;padding:0 16px}.unlock{margin-top:10px}.error{height:20px;font-size:12px;color:#c33;margin-top:8px}.admin{display:none}.admin.on{display:block}.wrap{max-width:1080px;margin:auto;padding:24px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.top a,.logout{font-size:12px;color:#777;text-decoration:none}.logout{border:0;background:none;padding:0}.tabs{display:flex;gap:20px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:28px}.tabs button{border:0;background:none;padding:0 0 12px;font-size:13px;color:#999;white-space:nowrap}.tabs button.active{color:#111;border-bottom:1px solid #111}.head{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:20px}.title{font-size:30px;letter-spacing:-.045em;margin:0 0 5px}.sub{margin:0}.list{border-top:1px solid var(--line)}.item{padding:18px 0;border-bottom:1px solid var(--line)}.item-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.item-title{font-size:15px;font-weight:700;line-height:1.4}.meta,.notice{font-size:12px;color:#888;margin-top:5px;line-height:1.45}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid #d8d8d8;background:#fff;height:34px;padding:0 10px;font-size:12px}.btn:disabled{opacity:.35}.btn.danger{color:#b22}.editor{margin-top:18px;padding-top:18px;border-top:1px solid #eee}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#777}.field input,.field textarea,.field select{width:100%;border:1px solid #ddd;background:#fff;padding:10px 11px;border-radius:0}.field textarea{min-height:82px;resize:vertical}.toggle{display:flex;align-items:center;gap:8px;font-size:12px}.savebar{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.option-editor{border:1px solid #e4e4e4;padding:12px;margin-top:9px}.option-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.option-top b{font-size:12px}.mini-danger{border:0;background:transparent;color:#b22;font-size:11px}.section-label{font-size:11px;color:#999;letter-spacing:.08em;margin:22px 0 8px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 28px}.stat{background:#f6f6f6;padding:16px}.stat b{display:block;font-size:28px;letter-spacing:-.04em}.stat span{font-size:11px;color:#777}.rank-row{display:flex;justify-content:space-between;gap:18px;border-top:1px solid var(--line);padding:12px 0;font-size:13px}.empty{padding:32px 0;color:#999;font-size:13px}.pill{display:inline-block;background:#f3f3f3;padding:3px 6px;font-size:10px;margin-right:4px;margin-top:6px}.question-map{font-size:11px;color:#777;margin-top:6px}.question-map code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#111}.bar-row{display:grid;grid-template-columns:minmax(110px,1fr) 2fr 32px;align-items:center;gap:10px;padding:7px 0;font-size:12px}.bar{height:5px;background:#eee}.bar>i{display:block;height:100%;background:#111}.inline-note{background:#f6f6f6;padding:12px;font-size:12px;color:#666;line-height:1.55;margin-bottom:18px}@media(max-width:700px){.form{grid-template-columns:1fr}.field.full{grid-column:auto}.stat-grid{grid-template-columns:repeat(2,1fr)}.head{align-items:flex-start;flex-direction:column}.item-head{align-items:flex-start}.actions{max-width:150px}.bar-row{grid-template-columns:100px 1fr 28px}}
</style></head><body>
<section class="gate" id="gate"><div class="gate-brand">CAMTYPE / ADMIN</div><div class="gate-body"><h1>Admin</h1><p>PIN 번호를 입력하세요.</p><input class="pin" id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><button class="unlock" id="unlock">접속</button><div class="error" id="error"></div></div></section>
<section class="admin" id="admin"><main class="wrap"><div class="top"><div class="brand">CAMTYPE / ADMIN</div><div><a href="../">서비스 보기</a>&nbsp;&nbsp;<button class="logout" id="logout">로그아웃</button></div></div><nav class="tabs" id="tabs"><button data-tab="questions">질문 관리</button><button data-tab="products">제품 관리</button><button data-tab="combos">추천 조합</button><button data-tab="types">결과 타입</button><button data-tab="stats">통계</button></nav><div id="content"></div></main></section>
<script type="module">
import {getAllQuestions,saveQuestions,getCameras,saveCameras,getTypes,saveTypes,getStats,resetStats} from '../js/store.js';
const ADMIN_PIN_HASH='3a2d98c0f5c0faada9569e073c2081a655a24c0b13bc16e9df133341c2430475',SESSION='camtype_admin_unlocked';let currentTab='questions';
const $=s=>document.querySelector(s),content=$('#content'),pin=$('#pin'),gate=$('#gate'),admin=$('#admin'),error=$('#error');
const esc=(v='')=>String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const safeJSON=v=>esc(JSON.stringify(v||{},null,2));
async function unlock(){const hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pin.value));const hex=[...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('');if(hex!==ADMIN_PIN_HASH){error.textContent='PIN 번호가 맞지 않습니다.';pin.value='';pin.focus();return}sessionStorage.setItem(SESSION,'1');gate.style.display='none';admin.classList.add('on');show('questions')}
function lock(){sessionStorage.removeItem(SESSION);admin.classList.remove('on');gate.style.display='flex';pin.value='';pin.focus()}
$('#unlock').onclick=unlock;pin.onkeydown=e=>{if(e.key==='Enter')unlock()};$('#logout').onclick=lock;$('#tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b)show(b.dataset.tab)};
function show(tab){currentTab=tab;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));({questions:renderQuestions,products:renderProducts,combos:renderCombos,types:renderTypes,stats:renderStats}[tab])()}
function header(title,sub,action=''){return `<div class="head"><div><h1 class="title">${title}</h1><p class="sub">${sub}</p></div>${action}</div>`}
function bindToggleEditors(){content.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>$('#'+b.dataset.edit).hidden=false);content.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>$('#'+b.dataset.cancel).hidden=true)}

function renderQuestions(){
  let data=getAllQuestions();
  content.innerHTML=header('질문 관리','순서, 문항, 선택지, 추천 영향값을 직접 수정합니다.',`<button class="black" id="addQuestion">질문 추가</button>`)+`<div class="inline-note">추천 흐름은 <b>예산 → 용도 → 사진/영상 → 휴대성 → 렌즈 → 조작 → 취향 → 색감 → 결과물 → 최종 성향</b> 순서를 기본으로 합니다. 선택지의 <b>성향 점수 JSON</b>이 제품 매칭에 직접 반영됩니다.</div><div class="list">${data.map((q,i)=>questionRow(q,i,data.length)).join('')}</div>`;
  $('#addQuestion').onclick=()=>{data.push({id:'q-'+Date.now(),order:data.length+1,type:'choice',title:'새 질문',kicker:'',active:true,importance:1,options:[{id:'a',label:'선택 A',desc:'',image:null,weights:{}},{id:'b',label:'선택 B',desc:'',image:null,weights:{}}]});saveQuestions(data);renderQuestions()};
  bindToggleEditors();
  content.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>moveQuestion(data,+b.dataset.up,-1));
  content.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>moveQuestion(data,+b.dataset.down,1));
  content.querySelectorAll('[data-delete-q]').forEach(b=>b.onclick=()=>{if(confirm('이 질문을 삭제할까요?')){data.splice(+b.dataset.deleteQ,1);saveQuestions(data);renderQuestions()}});
  content.querySelectorAll('[data-add-option]').forEach(b=>b.onclick=()=>{const i=+b.dataset.addOption,box=$(`#q-${i}`),wrap=box.querySelector('.options-editor'),n=wrap.children.length;wrap.insertAdjacentHTML('beforeend',optionEditor({id:'opt-'+Date.now(),label:'새 선택지',desc:'',image:null,weights:{}},n));bindRemoveOption(box)});
  content.querySelectorAll('[data-save-q]').forEach(b=>b.onclick=()=>saveQuestionEditor(data,+b.dataset.saveQ));
  data.forEach((_,i)=>bindRemoveOption($(`#q-${i}`)));
}
function questionRow(q,i,total){const scoreKeys=q.type==='number_wheel'?[q.hardConstraint||'number']:Array.from(new Set((q.options||[]).flatMap(o=>Object.keys(o.weights||o.scores||{}))));return `<div class="item"><div class="item-head"><div><div class="item-title">${String(i+1).padStart(2,'0')} · ${esc(q.title)}</div><div class="meta">${esc(q.type)}${q.type==='number_wheel'?` · ${q.min}~${q.max}${esc(q.unit||'')}`:` · 선택지 ${(q.options||[]).length}개`}${q.active===false?' · 숨김':''}</div><div class="question-map">영향값: ${scoreKeys.length?scoreKeys.map(k=>`<code>${esc(k)}</code>`).join(' · '):'없음'}</div></div><div class="actions"><button class="btn" data-up="${i}" ${i===0?'disabled':''}>위</button><button class="btn" data-down="${i}" ${i===total-1?'disabled':''}>아래</button><button class="btn" data-edit="q-${i}">수정</button><button class="btn danger" data-delete-q="${i}">삭제</button></div></div><div class="editor" id="q-${i}" hidden>${questionEditor(q,i)}</div></div>`}
function questionEditor(q,i){return `<div class="form"><div class="field full"><label>질문</label><input data-f="title" value="${esc(q.title)}"></div><div class="field full"><label>보조 문구</label><input data-f="kicker" value="${esc(q.kicker||'')}"></div><div class="field"><label>문항 유형</label><select data-f="type"><option value="choice" ${q.type==='choice'?'selected':''}>텍스트 선택</option><option value="image_choice" ${q.type==='image_choice'?'selected':''}>이미지 선택</option><option value="number_wheel" ${q.type==='number_wheel'?'selected':''}>숫자 휠</option></select></div><div class="field"><label>문항 중요도</label><input type="number" min="0" max="3" step="0.05" data-f="importance" value="${q.importance??1}"></div><div class="field"><label class="toggle"><input data-f="active" type="checkbox" ${q.active===false?'':'checked'}> 서비스에 사용</label></div></div>${q.type==='number_wheel'?wheelEditor(q):`<div class="section-label">선택지</div><div class="options-editor">${(q.options||[]).map(optionEditor).join('')}</div><button class="btn" data-add-option="${i}" style="margin-top:10px">선택지 추가</button>`}<div class="savebar"><button class="btn" data-cancel="q-${i}">취소</button><button class="black" data-save-q="${i}">저장</button></div>`}
function wheelEditor(q){return `<div class="form" style="margin-top:12px"><div class="field"><label>최소값</label><input type="number" data-f="min" value="${q.min??0}"></div><div class="field"><label>최대값</label><input type="number" data-f="max" value="${q.max??100}"></div><div class="field"><label>증가 단위</label><input type="number" data-f="step" value="${q.step??10}"></div><div class="field"><label>기본값</label><input type="number" data-f="defaultValue" value="${q.defaultValue??0}"></div><div class="field"><label>단위</label><input data-f="unit" value="${esc(q.unit||'')}"></div><div class="field"><label>필수조건 키</label><input class="mono" data-f="hardConstraint" value="${esc(q.hardConstraint||'')}"></div></div>`}
function optionEditor(o,n){return `<div class="option-editor"><div class="option-top"><b>선택지 ${n+1}</b><button class="mini-danger" data-remove-option>삭제</button></div><div class="form"><div class="field"><label>ID</label><input data-of="id" value="${esc(o.id||'')}"></div><div class="field"><label>표시 문구</label><input data-of="label" value="${esc(o.label||'')}"></div><div class="field full"><label>설명</label><input data-of="desc" value="${esc(o.desc||'')}"></div><div class="field full"><label>이미지 URL (지금은 비워둬도 됨)</label><input data-of="image" value="${esc(o.image||'')}"></div><div class="field full"><label>성향 가중치 JSON</label><textarea class="mono" data-of="weights">${safeJSON(o.weights||o.scores||{})}</textarea></div><div class="field full"><label>하드조건 JSON (선택)</label><textarea class="mono" data-of="constraints">${safeJSON(o.constraints||{})}</textarea></div></div></div>`}
function bindRemoveOption(box){if(!box)return;box.querySelectorAll('[data-remove-option]').forEach(b=>b.onclick=()=>{if(box.querySelectorAll('.option-editor').length<=2){alert('선택지는 최소 2개가 필요합니다.');return}b.closest('.option-editor').remove();box.querySelectorAll('.option-editor .option-top b').forEach((el,i)=>el.textContent=`선택지 ${i+1}`)})}
function moveQuestion(data,i,delta){const ni=i+delta;if(ni<0||ni>=data.length)return;[data[i],data[ni]]=[data[ni],data[i]];saveQuestions(data);renderQuestions()}
function saveQuestionEditor(data,i){const box=$(`#q-${i}`),q=data[i],newType=box.querySelector('[data-f=type]').value;q.title=box.querySelector('[data-f=title]').value.trim();q.kicker=box.querySelector('[data-f=kicker]').value.trim();q.active=box.querySelector('[data-f=active]').checked;q.importance=Math.max(0,Math.min(3,Number(box.querySelector('[data-f=importance]')?.value??1)));q.type=newType;if(newType==='number_wheel'){q.min=Number(box.querySelector('[data-f=min]')?.value??0);q.max=Number(box.querySelector('[data-f=max]')?.value??100);q.step=Math.max(1,Number(box.querySelector('[data-f=step]')?.value??10));q.defaultValue=Number(box.querySelector('[data-f=defaultValue]')?.value??q.min);q.unit=box.querySelector('[data-f=unit]')?.value.trim()||'';q.hardConstraint=box.querySelector('[data-f=hardConstraint]')?.value.trim()||'';delete q.options;}else{const opts=[];for(const el of box.querySelectorAll('.option-editor')){let weights={},constraints={};try{weights=JSON.parse(el.querySelector('[data-of=weights]').value||'{}');constraints=JSON.parse(el.querySelector('[data-of=constraints]').value||'{}')}catch{return alert('가중치 또는 하드조건 JSON 형식을 확인해 주세요.')}opts.push({id:el.querySelector('[data-of=id]').value.trim()||`opt-${Date.now()}-${opts.length}`,label:el.querySelector('[data-of=label]').value.trim(),desc:el.querySelector('[data-of=desc]').value.trim(),image:el.querySelector('[data-of=image]').value.trim()||null,weights,constraints})}q.options=opts;delete q.min;delete q.max;delete q.step;delete q.defaultValue;delete q.unit;delete q.hardConstraint;}saveQuestions(data);renderQuestions()}

function renderProducts(){let data=getCameras();content.innerHTML=header('제품 관리','바디, 가격, 이미지, 노출 상태와 제품 성향을 관리합니다.',`<button class="black" id="addProduct">제품 추가</button>`)+`<div class="list">${data.map((p,i)=>`<div class="item"><div class="item-head"><div><div class="item-title">${esc(p.brand)} ${esc(p.body)}</div><div class="meta">${p.price}만원 · ${p.active===false?'숨김':'노출'}</div>${(p.tags||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div><div class="actions"><button class="btn" data-edit="p-${i}">수정</button><button class="btn danger" data-delete-p="${i}">삭제</button></div></div><div class="editor" id="p-${i}" hidden>${productEditor(p,i)}</div></div>`).join('')}</div>`;$('#addProduct').onclick=()=>{data.push({id:'product-'+Date.now(),brand:'',body:'',lens:'',price:100,image:null,active:true,traits:{},tags:[]});saveCameras(data);renderProducts()};bindToggleEditors();content.querySelectorAll('[data-save-p]').forEach(b=>b.onclick=()=>saveProduct(data,+b.dataset.saveP));content.querySelectorAll('[data-delete-p]').forEach(b=>b.onclick=()=>{if(confirm('이 제품을 삭제할까요?')){data.splice(+b.dataset.deleteP,1);saveCameras(data);renderProducts()}})}
function productEditor(p,i){return `<div class="form"><div class="field"><label>브랜드</label><input data-f="brand" value="${esc(p.brand)}"></div><div class="field"><label>제품명</label><input data-f="body" value="${esc(p.body)}"></div><div class="field"><label>총 조합 가격(만원)</label><input type="number" data-f="price" value="${p.price}"></div><div class="field"><label>제품 이미지 URL</label><input data-f="image" value="${esc(p.image||'')}"></div><div class="field"><label>검증일</label><input type="date" data-f="verifiedAt" value="${esc(p.verifiedAt||'')}"></div><div class="field"><label class="toggle"><input type="checkbox" data-f="available" ${p.available===false?'':'checked'}> 현재 추천 가능</label></div><div class="field"><label class="toggle"><input type="checkbox" data-f="interchangeable" ${p.interchangeable===true?'checked':''}> 렌즈 교환식</label></div><div class="field full"><label>태그 (쉼표 구분)</label><input data-f="tags" value="${esc((p.tags||[]).join(', '))}"></div><div class="field full"><label>제품 성향 점수 JSON</label><textarea class="mono" data-f="traits">${safeJSON(p.traits||{})}</textarea></div><div class="field full"><label class="toggle"><input type="checkbox" data-f="active" ${p.active===false?'':'checked'}> 서비스에 노출</label></div></div><div class="savebar"><button class="btn" data-cancel="p-${i}">취소</button><button class="black" data-save-p="${i}">저장</button></div>`}
function saveProduct(data,i){const box=$(`#p-${i}`),p=data[i];p.brand=box.querySelector('[data-f=brand]').value.trim();p.body=box.querySelector('[data-f=body]').value.trim();p.price=Number(box.querySelector('[data-f=price]').value)||0;p.image=box.querySelector('[data-f=image]').value.trim()||null;p.tags=box.querySelector('[data-f=tags]').value.split(',').map(v=>v.trim()).filter(Boolean);p.verifiedAt=box.querySelector('[data-f=verifiedAt]')?.value||'';p.available=box.querySelector('[data-f=available]')?.checked!==false;p.interchangeable=box.querySelector('[data-f=interchangeable]')?.checked===true;p.active=box.querySelector('[data-f=active]').checked;try{p.traits=JSON.parse(box.querySelector('[data-f=traits]').value||'{}')}catch{return alert('제품 성향 점수 JSON 형식을 확인해 주세요.')}saveCameras(data);renderProducts()}

function renderCombos(){let data=getCameras();content.innerHTML=header('추천 조합','각 바디에 붙는 기본 렌즈와 조합 정보를 관리합니다.')+`<div class="list">${data.map((p,i)=>`<div class="item"><div class="item-head"><div><div class="item-title">${esc(p.brand)} ${esc(p.body)}</div><div class="meta">${esc(p.lens||'렌즈 미설정')} · ${p.price}만원</div></div><button class="btn" data-edit="c-${i}">수정</button></div><div class="editor" id="c-${i}" hidden><div class="form"><div class="field full"><label>추천 렌즈 / 조합</label><input data-f="lens" value="${esc(p.lens||'')}"></div><div class="field"><label>조합 총 가격(만원)</label><input type="number" data-f="price" value="${p.price}"></div><div class="field"><label>키워드</label><input data-f="tags" value="${esc((p.tags||[]).join(', '))}"></div></div><div class="savebar"><button class="btn" data-cancel="c-${i}">취소</button><button class="black" data-save-c="${i}">저장</button></div></div></div>`).join('')}</div>`;bindToggleEditors();content.querySelectorAll('[data-save-c]').forEach(b=>b.onclick=()=>{const i=+b.dataset.saveC,box=$(`#c-${i}`),p=data[i];p.lens=box.querySelector('[data-f=lens]').value.trim();p.price=Number(box.querySelector('[data-f=price]').value)||0;p.tags=box.querySelector('[data-f=tags]').value.split(',').map(v=>v.trim()).filter(Boolean);saveCameras(data);renderCombos()})}

function renderTypes(){let data=getTypes();content.innerHTML=header('결과 타입','카메라 MBTI 타입명, 설명과 판정 성향을 관리합니다.',`<button class="black" id="addType">타입 추가</button>`)+`<div class="list">${data.map((t,i)=>`<div class="item"><div class="item-head"><div><div class="item-title">${esc(t.name)}</div><div class="meta">${esc(t.line)}</div><div class="question-map">판정: ${Object.keys(t.weights||Object.fromEntries((t.keys||[]).map(k=>[k,1]))).map(k=>`<code>${esc(k)}</code>`).join(' · ')}</div></div><div class="actions"><button class="btn" data-edit="t-${i}">수정</button><button class="btn danger" data-delete-t="${i}">삭제</button></div></div><div class="editor" id="t-${i}" hidden><div class="form"><div class="field full"><label>타입명</label><input data-f="name" value="${esc(t.name)}"></div><div class="field full"><label>한 줄 설명</label><textarea data-f="line">${esc(t.line)}</textarea></div><div class="field full"><label>타입 가중치 JSON</label><textarea class="mono" data-f="weights">${safeJSON(t.weights||Object.fromEntries((t.keys||[]).map(k=>[k,1])))}</textarea></div><div class="field full"><label class="toggle"><input type="checkbox" data-f="active" ${t.active===false?'':'checked'}> 결과에 사용</label></div></div><div class="savebar"><button class="btn" data-cancel="t-${i}">취소</button><button class="black" data-save-t="${i}">저장</button></div></div></div>`).join('')}</div>`;$('#addType').onclick=()=>{data.push({id:'type-'+Date.now(),name:'NEW TYPE',line:'',weights:{},active:true});saveTypes(data);renderTypes()};bindToggleEditors();content.querySelectorAll('[data-save-t]').forEach(b=>b.onclick=()=>{const i=+b.dataset.saveT,box=$(`#t-${i}`),t=data[i];t.name=box.querySelector('[data-f=name]').value.trim();t.line=box.querySelector('[data-f=line]').value.trim();try{t.weights=JSON.parse(box.querySelector('[data-f=weights]').value||'{}')}catch{return alert('타입 가중치 JSON 형식을 확인해 주세요.')}delete t.keys;t.active=box.querySelector('[data-f=active]').checked;saveTypes(data);renderTypes()});content.querySelectorAll('[data-delete-t]').forEach(b=>b.onclick=()=>{if(confirm('이 결과 타입을 삭제할까요?')){data.splice(+b.dataset.deleteT,1);saveTypes(data);renderTypes()}})}

function renderStats(){const s=getStats(),cams=getCameras(),types=getTypes(),qs=getAllQuestions(),completion=s.starts?Math.round((s.completions/s.starts)*100):0,products=Object.entries(s.products||{}).sort((a,b)=>b[1]-a[1]),results=Object.entries(s.results||{}).sort((a,b)=>b[1]-a[1]);content.innerHTML=header('통계','현재 브라우저에서 발생한 실제 선택 데이터를 확인합니다.',`<button class="btn danger" id="resetStats">통계 초기화</button>`)+`<div class="stat-grid"><div class="stat"><b>${s.starts||0}</b><span>테스트 시작</span></div><div class="stat"><b>${s.completions||0}</b><span>완료</span></div><div class="stat"><b>${completion}%</b><span>완료율</span></div><div class="stat"><b>${products[0]?.[1]||0}</b><span>최다 추천 횟수</span></div></div><div class="section-label">많이 추천된 조합</div>${products.length?products.map(([id,n],i)=>{const p=cams.find(x=>x.id===id);return `<div class="rank-row"><span>${i+1}. ${esc(p?`${p.brand} ${p.body} + ${p.lens}`:id)}</span><b>${n}</b></div>`}).join(''):'<div class="empty">아직 데이터가 없습니다.</div>'}<div class="section-label">결과 타입 분포</div>${results.length?results.map(([id,n],i)=>{const t=types.find(x=>x.id===id);return `<div class="rank-row"><span>${i+1}. ${esc(t?.name||id)}</span><b>${n}</b></div>`}).join(''):'<div class="empty">아직 데이터가 없습니다.</div>'}<div class="section-label">문항별 선택 분포</div>${qs.map(q=>answerStats(q,s.answers?.[q.id]||{})).join('')}<p class="notice">현재 통계는 이 브라우저에만 저장됩니다. 공개 운영 전 Supabase 통계 저장소 연결이 필요합니다.</p>`;$('#resetStats').onclick=()=>{if(confirm('통계를 모두 초기화할까요?')){resetStats();renderStats()}}}
function answerStats(q,counts){const entries=Object.entries(counts),total=entries.reduce((a,[,n])=>a+n,0);if(!total)return `<div class="item"><div class="item-title">${esc(q.title)}</div><div class="meta">아직 선택 데이터가 없습니다.</div></div>`;const labelFor=id=>q.type==='number_wheel'?id.replace(q.id+'-','')+(q.unit||''):(q.options||[]).find(o=>o.id===id)?.label||id;return `<div class="item"><div class="item-title">${esc(q.title)}</div>${entries.sort((a,b)=>b[1]-a[1]).slice(0,8).map(([id,n])=>{const pct=Math.round(n/total*100);return `<div class="bar-row"><span>${esc(labelFor(id))}</span><div class="bar"><i style="width:${pct}%"></i></div><b>${pct}%</b></div>`}).join('')}</div>`}

if(sessionStorage.getItem(SESSION)==='1'){gate.style.display='none';admin.classList.add('on');show('questions')}else pin.focus();
</script></body></html>
