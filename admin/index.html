<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAMERA TYPE ADMIN</title>
<style>
:root{--bg:#f4f1e9;--ink:#171717;--muted:#77736c;--line:#d7d1c6;--card:#fffdf8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}main{max-width:1100px;margin:auto;padding:28px 20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font-weight:900;letter-spacing:.12em;font-size:13px}.back{color:var(--muted);font-size:13px;text-decoration:none}.grid{display:grid;grid-template-columns:220px 1fr;gap:22px}.nav,.panel{background:var(--card);border:1px solid var(--line);border-radius:20px}.nav{padding:12px;height:max-content}.nav button{width:100%;border:0;background:transparent;padding:12px 10px;text-align:left;border-radius:10px;cursor:pointer}.nav button.active{background:#171717;color:#fff}.panel{padding:22px}.title{font-size:30px;font-weight:900;letter-spacing:-.04em;margin:0 0 4px}.sub{color:var(--muted);font-size:13px;margin-bottom:24px}.row{border-top:1px solid var(--line);padding:16px 0}.row:first-of-type{border-top:0}.row strong{display:block}.meta{font-size:12px;color:var(--muted);margin-top:5px}.status{display:inline-block;margin-top:8px;padding:4px 8px;border:1px solid var(--line);border-radius:999px;font-size:11px}.placeholder{margin-top:14px;border:1px dashed #aaa39a;border-radius:14px;padding:20px;text-align:center;color:var(--muted);font-size:12px}.note{background:#ece6dc;padding:14px 16px;border-radius:14px;font-size:13px;color:#5c564f;line-height:1.55}@media(max-width:760px){.grid{grid-template-columns:1fr}.nav{display:flex;overflow:auto}.nav button{min-width:max-content}}
</style>
</head>
<body><main><div class="top"><div class="brand">CAMERA TYPE / ADMIN</div><a class="back" href="../">서비스 보기 ↗</a></div><div class="grid"><aside class="nav"><button class="active">질문 관리</button><button>제품 관리</button><button>추천 조합</button><button>결과 타입</button><button>통계</button></aside><section class="panel"><h1 class="title">질문 관리</h1><div class="sub">현재는 미리보기 전용입니다. Supabase 연결 후 저장/업로드가 활성화됩니다.</div><div class="note">이미지 슬롯과 데이터 필드는 이미 분리되어 있습니다. 나중에 Storage URL만 넣으면 이미지형 문항으로 바로 전환됩니다.</div><div id="questionList"></div></section></div></main><script type="module">import{QUESTIONS}from'../data/questions.js';const el=document.querySelector('#questionList');el.innerHTML=QUESTIONS.map((q,i)=>`<div class="row"><strong>${String(i+1).padStart(2,'0')} · ${q.title}</strong><div class="meta">${q.type} · 선택지 ${q.options.length}개</div><span class="status">활성</span>${q.type==='image_choice'?'<div class="placeholder">IMAGE SLOT A / B · 업로드 기능은 Supabase 연결 후 활성화</div>':''}</div>`).join('');</script></body></html>
