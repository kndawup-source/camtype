<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>CAMTYPE ADMIN</title>
<style>
:root{--ink:#111;--muted:#777;--line:#e7e7e7;--soft:#f5f5f5}*{box-sizing:border-box}html,body{margin:0;background:#fff;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit}.gate{min-height:100dvh;max-width:430px;margin:auto;padding:22px 18px;display:flex;flex-direction:column}.gate-brand,.brand{font-size:13px;font-weight:800;letter-spacing:.12em}.gate-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:50px}.gate h1{font-size:34px;letter-spacing:-.05em;margin:0 0 10px}.gate p,.sub{font-size:13px;color:#777}.pin{height:54px;border:1px solid #d8d8d8;padding:0 14px;font-size:22px;letter-spacing:.22em;text-align:center;outline:none}.pin:focus,input:focus,textarea:focus,select:focus{border-color:#111;outline:none}.unlock,.black{height:48px;border:0;background:#111;color:#fff;font-weight:700;padding:0 18px}.unlock{margin-top:10px}.error{height:20px;font-size:12px;color:#c33;margin-top:8px}.admin{display:none}.admin.on{display:block}.wrap{max-width:1040px;margin:auto;padding:22px 18px 50px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.top a,.logout{font-size:12px;color:#777;text-decoration:none}.logout{border:0;background:none;padding:0}.tabs{display:flex;gap:20px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:26px}.tabs button{border:0;background:none;padding:0 0 12px;font-size:13px;color:#888;white-space:nowrap}.tabs button.active{color:#111;border-bottom:1px solid #111}.head{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:20px}.title{font-size:30px;letter-spacing:-.045em;margin:0 0 5px}.sub{margin:0}.list{border-top:1px solid var(--line)}.item{padding:18px 0;border-bottom:1px solid var(--line)}.item-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.item-title{font-size:15px;font-weight:700}.meta{font-size:12px;color:#888;margin-top:5px}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid #d8d8d8;background:#fff;height:34px;padding:0 10px;font-size:12px}.btn.danger{color:#b22}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#777}.field input,.field textarea,.field select{width:100%;border:1px solid #ddd;background:#fff;padding:10px 11px;border-radius:0}.field textarea{min-height:74px;resize:vertical}.toggle{display:flex;align-items:center;gap:8px;font-size:12px}.savebar{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.notice{font-size:12px;color:#666;margin:10px 0 0}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 26px}.stat{background:#f6f6f6;padding:16px}.stat b{display:block;font-size:28px;letter-spacing:-.04em}.stat span{font-size:11px;color:#777}.rank-row{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:12px 0;font-size:13px}.empty{padding:36px 0;color:#999;font-size:13px}.tagline{font-size:12px;color:#777;margin-top:6px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}.section-label{font-size:11px;color:#999;letter-spacing:.08em;margin:22px 0 6px}@media(max-width:700px){.form{grid-template-columns:1fr}.field.full{grid-column:auto}.stat-grid{grid-template-columns:repeat(2,1fr)}.head{align-items:flex-start;flex-direction:column}}
</style></head><body>
<section class="gate" id="gate"><div class="gate-brand">CAMTYPE / ADMIN</div><div class="gate-body"><h1>Admin</h1><p>PIN 번호를 입력하세요.</p><input class="pin" id="pin" type="password" inputmode="numeric" maxlength="6"><button class="unlock" id="unlock">접속</button><div class="error" id="error"></div></div></section>
<section class="admin" id="admin"><main class="wrap"><div class="top"><div class="brand">CAMTYPE / ADMIN</div><div><a href="../">서비스 보기</a>&nbsp;&nbsp;<button class="logout" id="logout">로그아웃</button></div></div><nav class="tabs" id="tabs"><button data-tab="questions">질문 관리</button><button data-tab="products">제품 관리</button><button data-tab="combos">추천 조합</button><button data-tab="types">결과 타입</button><button data-tab="stats">통계</button></nav><div id="content"></div></main></section>
<script type="module">
import {getQuestions,saveQuestions,getCameras,saveCameras,getTypes,saveTypes,getStats,resetStats} from '../js/store.js';
const ADMIN_PIN='529816',key='camtype_admin_unlocked';let tab='questions';
const $=s=>document.querySelector(s), gate=$('#gate'),admin=$('#admin'),pin=$('#pin'),error=$('#error'),content=$('#content');
function esc(v=''){return String(v).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function openAdmin(){sessionStorage.setItem(key,'1');gate.style.display='none';admin.classList.add('on');show('questions')}
function lock(){sessionStorage.removeItem(key);admin.classList.remove('on');gate.style.display='flex';pin.value='';pin.focus()}
function verify(){if(pin.value===ADMIN_PIN)openAdmin();else{error.textContent='PIN 번호가 맞지 않습니다.';pin.value='';pin.focus()}}
$('#unlock').onclick=verify;pin.onkeydown=e=>{if(e.key==='Enter')verify()};$('#logout').onclick=lock;
$('#tabs').onclick=e=>{const b=e.target.closest('button[data-tab]');if(b)show(b.dataset.tab)};
function show(next){tab=next;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));({questions:renderQuestions,products:renderProducts,combos:renderCombos,types:renderTypes,stats:renderStats}[tab])()}
function header(title,sub,action=''){return `<div class="head"><div><h1 class="title">${title}</h1><p class="sub">${sub}</p></div>${action}</div>`}
function bindEdit(root,onSave,onDelete){root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>root.querySelector(`#${b.dataset.edit}`).hidden=false);root.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>root.querySelector(`#${b.dataset.cancel}`).hidden=true);root.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>onSave(b));root.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>onDelete(b));}
function renderQuestions(){let data=getQuestions();content.innerHTML=header('질문 관리','질문 문구와 선택지를 수정합니다.')+`<div class="list">${data.map((q,i)=>`<div class="item"><div class="item-head"><div><div class="item-title">${String(i+1).padStart(2,'0')} · ${esc(q.title)}</div><div class="meta">${q.type}${q.type==='number_wheel'?` · ${q.min}~${q.max}${esc(q.unit||'')}`:` · 선택지 ${(q.options||[]).length}개`}</div></div><button class="btn" data-edit="q-${i}">수정</button></div><div id="q-${i}" hidden><div class="form"><div class="field full"><label>질문</label><input data-f="title" value="${esc(q.title)}"></div><div class="field full"><label>보조문구</label><input data-f="kicker" value="${esc(q.kicker||'')}"></div></div><div class="savebar"><button class="btn" data-cancel="q-${i}">취소</button><button class="black" data-save="${i}">저장</button></div></div></div>`).join('')}</div>`;bindEdit(content,b=>{const i=+b.dataset.save,box=$(`#q-${i}`);data[i].title=box.querySelector('[data-f=title]').value;data[i].kicker=box.querySelector('[data-f=kicker]').value;saveQuestions(data);renderQuestions()},()=>{});}
function renderProducts(){let data=getCameras();content.innerHTML=header('제품 관리','카메라 바디 정보와 기준 가격을 관리합니다.',`<button class="black" id="addProduct">제품 추가</button>`)+`<div class="list">${data.map((p,i)=>`<div class="item"><div class="item-head"><div><div class="item-title">${esc(p.brand)} ${esc(p.body)}</div><div class="meta">${p.price}만원 · ${p.active===false?'숨김':'노출'}</div></div><div class="actions"><button class="btn" data-edit="p-${i}">수정</button><button class="btn danger" data-delete="${i}">삭제</button></div></div><div id="p-${i}" hidden>${productForm(p)}</div></div>`).join('')}</div>`;
$('#addProduct').onclick=()=>{data.push({id:'product-'+Date.now(),brand:'',body:'',lens:'',price:100,image:null,active:true,traits:{},tags:[]});saveCameras(data);renderProducts()};bindEdit(content,b=>saveProductForm(data,+b.dataset.save),b=>{if(confirm('이 제품을 삭제할까요?')){data.splice(+b.dataset.delete,1);saveCameras(data);renderProducts()}});}
function productForm(p){return `<div class="form"><div class="field"><label>브랜드</label><input data-f="brand" value="${esc(p.brand)}"></div><div class="field"><label>제품명</label><input data-f="body" value="${esc(p.body)}"></div><div class="field"><label>기준 가격(만원)</label><input data-f="price" type="number" value="${p.price}"></div><div class="field"><label>이미지 URL</label><input data-f="image" value="${esc(p.image||'')}"></div><div class="field full"><label>태그 (쉼표 구분)</label><input data-f="tags" value="${esc((p.tags||[]).join(', '))}"></div><div class="field full"><label class="toggle"><input data-f="active" type="checkbox" ${p.active===false?'':'checked'}> 서비스에 노출</label></div></div><div class="savebar"><button class="btn" data-cancel="p-${getCameras().findIndex(x=>x.id===p.id)}">취소</button><button class="black" data-save="${getCameras().findIndex(x=>x.id===p.id)}">저장</button></div>`}
function saveProductForm(data,i){const box=$(`#p-${i}`),p=data[i];p.brand=box.querySelector('[data-f=brand]').value.trim();p.body=box.querySelector('[data-f=body]').value.trim();p.price=Number(box.querySelector('[data-f=price]').value)||0;p.image=box.querySelector('[data-f=image]').value.trim()||null;p.tags=box.querySelector('[data-f=tags]').value.split(',').map(v=>v.trim()).filter(Boolean);p.active=box.querySelector('[data-f=active]').checked;saveCameras(data);renderProducts()}
function renderCombos(){let data=getCameras();content.innerHTML=header('추천 조합','각 바디에 추천할 렌즈와 추천 키워드를 수정합니다.')+`<div class="list">${data.map((p,i)=>`<div class="item"><div class="item-head"><div><div class="item-title">${esc(p.brand)} ${esc(p.body)}</div><div class="meta">${esc(p.lens||'렌즈 미설정')}</div><div class="tagline">${esc((p.tags||[]).join(' · '))}</div></div><button class="btn" data-edit="c-${i}">수정</button></div><div id="c-${i}" hidden><div class="form"><div class="field full"><label>추천 렌즈 / 조합</label><input data-f="lens" value="${esc(p.lens||'')}"></div><div class="field full"><label>추천 키워드 (쉼표 구분)</label><input data-f="tags" value="${esc((p.tags||[]).join(', '))}"></div><div class="field full"><label>성향 점수 JSON</label><textarea class="mono" data-f="traits">${esc(JSON.stringify(p.traits||{},null,2))}</textarea></div></div><div class="savebar"><button class="btn" data-cancel="c-${i}">취소</button><button class="black" data-save="${i}">저장</button></div></div></div>`).join('')}</div>`;bindEdit(content,b=>{const i=+b.dataset.save,box=$(`#c-${i}`),p=data[i];p.lens=box.querySelector('[data-f=lens]').value.trim();p.tags=box.querySelector('[data-f=tags]').value.split(',').map(v=>v.trim()).filter(Boolean);try{p.traits=JSON.parse(box.querySelector('[data-f=traits]').value||'{}')}catch{return alert('성향 점수 JSON 형식을 확인해 주세요.')};saveCameras(data);renderCombos()},()=>{});}
function renderTypes(){let data=getTypes();content.innerHTML=header('결과 타입','CAMTYPE 이름, 설명, 판정 키를 관리합니다.',`<button class="black" id="addType">타입 추가</button>`)+`<div class="list">${data.map((t,i)=>`<div class="item"><div class="item-head"><div><div class="item-title">${esc(t.name)}</div><div class="meta">${esc(t.line)}</div><div class="tagline mono">${esc((t.keys||[]).join(', '))}</div></div><div class="actions"><button class="btn" data-edit="t-${i}">수정</button><button class="btn danger" data-delete="${i}">삭제</button></div></div><div id="t-${i}" hidden><div class="form"><div class="field full"><label>타입명</label><input data-f="name" value="${esc(t.name)}"></div><div class="field full"><label>설명</label><textarea data-f="line">${esc(t.line)}</textarea></div><div class="field full"><label>판정 키 (쉼표 구분)</label><input class="mono" data-f="keys" value="${esc((t.keys||[]).join(', '))}"></div><div class="field full"><label class="toggle"><input data-f="active" type="checkbox" ${t.active===false?'':'checked'}> 결과에 사용</label></div></div><div class="savebar"><button class="btn" data-cancel="t-${i}">취소</button><button class="black" data-save="${i}">저장</button></div></div></div>`).join('')}</div>`;$('#addType').onclick=()=>{data.push({id:'type-'+Date.now(),name:'NEW TYPE',line:'',keys:[],active:true});saveTypes(data);renderTypes()};bindEdit(content,b=>{const i=+b.dataset.save,box=$(`#t-${i}`),t=data[i];t.name=box.querySelector('[data-f=name]').value.trim();t.line=box.querySelector('[data-f=line]').value.trim();t.keys=box.querySelector('[data-f=keys]').value.split(',').map(v=>v.trim()).filter(Boolean);t.active=box.querySelector('[data-f=active]').checked;saveTypes(data);renderTypes()},b=>{if(confirm('이 결과 타입을 삭제할까요?')){data.splice(+b.dataset.delete,1);saveTypes(data);renderTypes()}});}
function renderStats(){const s=getStats(),cams=getCameras(),types=getTypes();const completion=s.starts?Math.round((s.completions/s.starts)*100):0;const topProducts=Object.entries(s.products||{}).sort((a,b)=>b[1]-a[1]);const topTypes=Object.entries(s.results||{}).sort((a,b)=>b[1]-a[1]);content.innerHTML=header('통계','현재 브라우저에 저장된 테스트 이용 통계입니다.',`<button class="btn danger" id="resetStats">통계 초기화</button>`)+`<div class="stat-grid"><div class="stat"><b>${s.starts||0}</b><span>테스트 시작</span></div><div class="stat"><b>${s.completions||0}</b><span>완료</span></div><div class="stat"><b>${completion}%</b><span>완료율</span></div><div class="stat"><b>${topProducts[0]?.[1]||0}</b><span>최다 추천 횟수</span></div></div><div class="section-label">많이 추천된 조합</div>${topProducts.length?topProducts.map(([id,n],i)=>{const p=cams.find(x=>x.id===id);return `<div class="rank-row"><span>${i+1}. ${esc(p?`${p.brand} ${p.body} + ${p.lens}`:id)}</span><b>${n}</b></div>`}).join(''):'<div class="empty">아직 데이터가 없습니다.</div>'}<div class="section-label">결과 타입 분포</div>${topTypes.length?topTypes.map(([id,n],i)=>{const t=types.find(x=>x.id===id);return `<div class="rank-row"><span>${i+1}. ${esc(t?.name||id)}</span><b>${n}</b></div>`}).join(''):'<div class="empty">아직 데이터가 없습니다.</div>'}<p class="notice">Supabase 연결 전에는 이 브라우저에서 발생한 데이터만 집계됩니다.</p>`;$('#resetStats').onclick=()=>{if(confirm('통계를 모두 초기화할까요?')){resetStats();renderStats()}}}
if(sessionStorage.getItem(key)==='1')openAdmin();else pin.focus();
</script></body></html>
